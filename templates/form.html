{% extends "base.html" %}
{% block contenido %}
<h2>{{ accion }} libro</h2>
<form class="formulario" method="post">
  <label>Título *
    <input type="text" name="titulo" value="{{ libro.titulo or '' }}" required>
  </label>
  <label>Autor *
    <input type="text" name="autor" value="{{ libro.autor or '' }}" required>
  </label>
  <label>Año
    <input type="number" name="anio" value="{{ libro.anio or '' }}" min="0" max="2100">
  </label>
  <label>Género
    <input type="text" name="genero" value="{{ libro.genero or '' }}">
  </label>
  <div class="botones">
    <button type="submit" class="btn">{{ accion }}</button>
    <a href="{{ url_for('index') }}">Cancelar</a>
  </div>
</form>
{% endblock %}

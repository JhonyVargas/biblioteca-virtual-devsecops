<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biblioteca Virtual</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a href="{{ url_for('index') }}" class="logo">📚 Biblioteca Virtual</a>
    <a href="{{ url_for('nuevo_libro') }}" class="btn">+ Nuevo libro</a>
  </header>
  <main>
    {% with mensajes = get_flashed_messages(with_categories=true) %}
      {% for categoria, mensaje in mensajes %}
        <div class="alerta {{ categoria }}">{{ mensaje }}</div>
      {% endfor %}
    {% endwith %}
    {% block contenido %}{% endblock %}
  </main>
  <footer>Proyecto de escaneo de vulnerabilidades · DevSecOps</footer>
</body>
</html>
